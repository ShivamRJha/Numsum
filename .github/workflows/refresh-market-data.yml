name: Refresh market data

# Nightly refresh of mutual-fund data for /tools/investment-planner.
# Uses the same FIREBASE_SERVICE_ACCOUNT_JSON secret and FIREBASE_PROJECT_ID variable as "Deploy Firestore".
on:
  schedule:
    - cron: "10 19 * * *" # 00:40 IST, after AMFI publishes the day's NAVs
  workflow_dispatch:

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Offline checks
        run: |
          npx tsx tests/invest/market-data.test.ts
          npx tsx tests/invest/planner.test.ts
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Fetch, score and write to Firestore
        run: npx tsx scripts/refresh-market-data.ts
